name: publish

on:
  push:
    tags: ['v*']

permissions:
  # contents: write 是创建 GitHub Release 所需
  contents: write
  id-token: write

jobs:
  publish:
    # Enable after npm Trusted Publishing is configured:
    #   gh variable set NPM_TRUSTED_PUBLISHING --body true
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package version";
            exit 1;
          }
      - run: node --check index.js
      - run: node --check client.js
      - run: npm test
      - run: npm publish --access public --provenance
      - name: Create GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(mktemp)
          awk -v ver="$version" '
            index($0, "## " ver " ") == 1 || $0 == "## " ver { ok = 1; next }
            ok && /^## / { exit }
            ok { print }
          ' CHANGELOG.md > "$notes"
          test -s "$notes" || { echo "CHANGELOG has no section for $version" >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
