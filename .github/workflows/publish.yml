name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package version";
            exit 1;
          }
      - run: node --check index.js
      - run: node --check client.js
      - run: npm test
      - run: npm publish --access public --provenance
